  <script>
    // Número aleatório de pessoas assistindo (800-1000)
    function updateViewers() {
      var viewers = Math.floor(Math.random() * (1000 - 800 + 1)) + 800;
      document.getElementById('viewer-count').textContent = viewers + ' People watching this video';
    }
    updateViewers();
    setInterval(updateViewers, 5000);
  </script>

  <script>
    // Atualiza a data do banner dinamicamente (espanhol)
    (function() {
      var days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
      var months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
      var hoje = new Date();
      var dayName = days[hoje.getDay()];
      var dd = String(hoje.getDate()).padStart(2, '0');
      var mm = months[hoje.getMonth()];
      var yyyy = hoje.getFullYear();
      document.getElementById('deadline-date').textContent = dayName + ', ' + mm + '/' + dd + '/' + yyyy;
    })();
  </script>

  <script>
    // Repassa parâmetros da URL (UTM, gclid, etc.) para o link de checkout,
    // removendo a senha "cpns" se estiver presente.
    (function() {
      var searchParams = new URLSearchParams(window.location.search);
      searchParams.delete('cpns');
      var paramsString = searchParams.toString();
      if (!paramsString) return;
      var link = document.getElementById('checkout-link');
      if (link) {
        var href = link.getAttribute('href');
        var separator = href.indexOf('?') !== -1 ? '&' : '?';
        link.setAttribute('href', href + separator + paramsString);
      }
    })();
  </script>
